name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          architecture: x64
      - name: Check query and directory scripts
        run: |
          node --check fetch-usage.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check build-room-directory.js
      - name: Build Windows x64 executable
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HPU-Power-Widget-Windows-x64
          path: dist/HPU-Power-Widget-Windows.exe
          if-no-files-found: error
